<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outra Volta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Material Design 3. Tokens por papel de cor (seed azul), escala tipográfica M3, formas 4/12/28/full.
   Layout: barra de topo + conteúdo em coluna única de 1200px; navigation bar inferior em ecrãs compactos. */
:root{
  --primary:#3A5BA9;--on-primary:#FFFFFF;--primary-container:#D9E2FF;--on-primary-container:#001945;
  --secondary:#575E71;--secondary-container:#DBE2F9;--on-secondary-container:#141B2C;
  --tertiary:#715573;--on-tertiary:#FFFFFF;--tertiary-container:#FBD7FC;--on-tertiary-container:#29132D;
  --error:#BA1A1A;--error-container:#FFDAD6;--on-error-container:#410002;
  --surface:#FAF8FF;--on-surface:#1A1B20;--on-surface-variant:#44474F;
  --outline:#757780;--outline-variant:#C5C6D0;
  --sc-low:#F4F3FA;--sc:#EEEDF4;--sc-high:#E8E7EF;--sc-highest:#E2E2E9;
  --inverse-surface:#2F3036;--inverse-on-surface:#F1F0F7;
  --good:#1B6C3A;--warn:#8A5100;
  --shadow1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --shadow3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#B0C6FF;--on-primary:#002D6C;--primary-container:#264484;--on-primary-container:#D9E2FF;
  --secondary:#BFC6DC;--secondary-container:#404659;--on-secondary-container:#DBE2F9;
  --tertiary:#DEBCDF;--on-tertiary:#402843;--tertiary-container:#583E5B;--on-tertiary-container:#FBD7FC;
  --error:#FFB4AB;--error-container:#93000A;--on-error-container:#FFDAD6;
  --surface:#121318;--on-surface:#E3E2E9;--on-surface-variant:#C5C6D0;
  --outline:#8F9099;--outline-variant:#44474F;
  --sc-low:#1A1B20;--sc:#1E1F25;--sc-high:#292A2F;--sc-highest:#34343A;
  --inverse-surface:#E3E2E9;--inverse-on-surface:#2F3036;
  --good:#7EDB9B;--warn:#FFB867;color-scheme:dark;}}
:root[data-theme="dark"]{
  --primary:#B0C6FF;--on-primary:#002D6C;--primary-container:#264484;--on-primary-container:#D9E2FF;
  --secondary:#BFC6DC;--secondary-container:#404659;--on-secondary-container:#DBE2F9;
  --tertiary:#DEBCDF;--on-tertiary:#402843;--tertiary-container:#583E5B;--on-tertiary-container:#FBD7FC;
  --error:#FFB4AB;--error-container:#93000A;--on-error-container:#FFDAD6;
  --surface:#121318;--on-surface:#E3E2E9;--on-surface-variant:#C5C6D0;
  --outline:#8F9099;--outline-variant:#44474F;
  --sc-low:#1A1B20;--sc:#1E1F25;--sc-high:#292A2F;--sc-highest:#34343A;
  --inverse-surface:#E3E2E9;--inverse-on-surface:#2F3036;
  --good:#7EDB9B;--warn:#FFB867;color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--surface);color:var(--on-surface);font:400 16px/24px Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--primary)}
h1,h2,h3,p{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:4px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
svg.i.s{width:18px;height:18px}

/* tipografia M3 */
.display{font:400 45px/52px Roboto,sans-serif;letter-spacing:0}
.headline-l{font:400 32px/40px Roboto,sans-serif}
.headline-m{font:400 28px/36px Roboto,sans-serif}
.headline-s{font:400 24px/32px Roboto,sans-serif}
.title-l{font:400 22px/28px Roboto,sans-serif}
.title-m{font:500 16px/24px Roboto,sans-serif;letter-spacing:.15px}
.body-m{font:400 14px/20px Roboto,sans-serif;letter-spacing:.25px}
.label-l{font:500 14px/20px Roboto,sans-serif;letter-spacing:.1px}
.label-m{font:500 12px/16px Roboto,sans-serif;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.num{font-variant-numeric:tabular-nums}

/* barra de topo */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--outline-variant)}
.topbar .wrap{display:flex;align-items:center;gap:8px;height:64px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--on-surface);font:500 22px/28px Roboto,sans-serif;margin-right:16px}
.logo svg{width:28px;height:28px;color:var(--primary)}
.topnav{display:flex;align-items:center;gap:4px;align-self:stretch}
.topnav>a{height:40px;padding:0 16px;border-radius:20px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--on-surface-variant);font:500 14px/20px Roboto;position:relative}
.topnav>a:hover,.mega-btn:hover{background:var(--sc-high)}
.topnav>a[aria-current="page"],.mega-btn[aria-current="page"]{background:var(--secondary-container);color:var(--on-secondary-container)}
.spacer{flex:1}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:var(--on-primary);font:500 11px/18px Roboto;text-align:center}
.menu-wrap{position:relative}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--primary-container);color:var(--on-primary-container);font:500 16px/24px Roboto;cursor:pointer}
.menu{position:absolute;right:0;top:48px;min-width:240px;background:var(--sc-high);border-radius:4px;box-shadow:var(--shadow3);padding:8px 0;z-index:30}
.menu[hidden]{display:none}
.menu .who{padding:8px 16px 12px;border-bottom:1px solid var(--outline-variant);margin-bottom:8px}
.menu a,.menu button{display:flex;width:100%;height:48px;align-items:center;gap:12px;padding:0 16px;border:0;background:none;text-align:left;text-decoration:none;color:var(--on-surface);cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--sc-highest)}

/* botões */
.btn{position:relative;overflow:hidden;height:40px;padding:0 24px;border:0;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 14px/20px Roboto;letter-spacing:.1px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.btn:hover::before{opacity:.08}.btn:active::before{opacity:.12}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn-outlined{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1px var(--outline)}
.btn-text{background:transparent;color:var(--primary);padding:0 12px}
.btn-lg{height:56px;border-radius:28px;padding:0 32px;font-size:16px}
.icon-btn{position:relative;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--on-surface-variant);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.icon-btn[aria-pressed="true"]{color:var(--primary)}
.fab{position:fixed;right:16px;bottom:16px;z-index:15;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow3);text-decoration:none;font:500 14px/20px Roboto}
.fab:hover{filter:brightness(.96)}

/* campos preenchidos */
.tf{position:relative;background:var(--sc-highest);border-radius:4px 4px 0 0;border-bottom:1px solid var(--on-surface-variant)}
.tf:focus-within{box-shadow:inset 0 -2px 0 var(--primary)}
.tf input,.tf select,.tf textarea{display:block;width:100%;height:56px;border:0;background:transparent;padding:24px 16px 6px;outline:0;appearance:none;-moz-appearance:textfield;border-radius:4px 4px 0 0}
.tf input::-webkit-outer-spin-button,.tf input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tf textarea{height:auto;min-height:132px;padding-top:28px;resize:vertical}
.tf label{position:absolute;left:16px;top:16px;color:var(--on-surface-variant);pointer-events:none;transition:top .15s,font-size .15s;font-size:16px;line-height:24px}
.tf input:focus+label,.tf input:not(:placeholder-shown)+label,.tf textarea:focus+label,.tf textarea:not(:placeholder-shown)+label,.tf.sel label{top:6px;font-size:12px;line-height:16px}
.tf:focus-within label{color:var(--primary)}
.tf.sel::after{content:"";position:absolute;right:16px;top:27px;border:5px solid transparent;border-top-color:var(--on-surface-variant);pointer-events:none}
.tf select option{background:var(--sc-high);color:var(--on-surface)}
.tf .pre{position:absolute;right:16px;bottom:8px;color:var(--on-surface-variant)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:0 4px}
.switch{appearance:none;flex:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--sc-highest);position:relative;cursor:pointer;margin:0}
.switch::before{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:all .15s}
.switch:checked{background:var(--primary);border-color:var(--primary)}
.switch:checked::before{left:20px;width:24px;height:24px;background:var(--on-primary)}

/* cartões e chips */
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--outline-variant);border-radius:12px;overflow:hidden;transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow1)}
.card .media{position:relative;aspect-ratio:5/4;background:var(--sc);display:grid;place-items:center;overflow:hidden}
.card .media .ph{height:86%;width:auto}
.card .media img{width:100%;height:100%;object-fit:cover}
.card .heart{position:absolute;top:4px;right:4px;background:color-mix(in srgb,var(--surface) 80%,transparent)}
.card .tags{position:absolute;left:8px;bottom:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.card .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.card .title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:48px}
.card .title a{color:var(--on-surface);text-decoration:none}
.card .title a::after,.card .title span::after{content:"";position:absolute;inset:0;z-index:1}
.card .price{margin-top:8px}
.card .meta{display:flex;align-items:center;gap:4px;margin-top:4px}
.card .meta .when{margin-left:auto}
.card .foot{border-top:1px solid var(--outline-variant);padding:8px;display:flex;justify-content:flex-end;position:relative;z-index:2}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;background:var(--secondary-container);color:var(--on-secondary-container)}
.pill.warn{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 12px;border-radius:8px;border:1px solid var(--outline);background:transparent;color:var(--on-surface-variant);cursor:pointer}
.chip:hover{background:var(--sc-high)}
.chip svg{width:18px;height:18px;fill:currentColor}
.bat{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow1)}
.ring{width:32px;height:32px}
.ring .t{fill:none;stroke:var(--outline-variant);stroke-width:4}
.ring .v{fill:none;stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:18px 18px}
.ring text{font:500 10px Roboto;fill:var(--on-surface);text-anchor:middle}
.ring.anim .v{animation:fill 1.1s .3s cubic-bezier(.2,0,0,1) both}
@keyframes fill{from{stroke-dashoffset:var(--len)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}

/* hero e pesquisa */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:center;padding:40px 0 24px}
.hero h1{margin-bottom:16px;max-width:15ch}
.hero p.lead{max-width:44ch;color:var(--on-surface-variant)}
.hero-art{position:relative;height:340px;border-radius:40px;background:var(--primary-container);display:grid;place-items:center;overflow:hidden}
.hero-art>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.hero-art .spec{position:absolute;right:20px;bottom:20px;background:var(--surface);border-radius:16px;padding:12px 16px 12px 12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow3)}
.hero-art .spec .ring{width:56px;height:56px}
.search{background:var(--sc-low);border:1px solid var(--outline-variant);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px}
.search .row{display:grid;grid-template-columns:2fr 1.1fr 1.4fr auto;gap:12px;align-items:start}
.search .prices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.search .adv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:16px;border-top:1px solid var(--outline-variant)}
.search .adv[hidden]{display:none}
.search .adv .switch-row{background:var(--sc-highest);border-radius:4px;padding:0 16px}
.search .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toggle-adv svg{transition:transform .2s}
.toggle-adv[aria-expanded="true"] svg{transform:rotate(180deg)}
.section{padding:32px 0 8px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.cta{margin:40px 0 16px;border-radius:28px;background:var(--primary-container);color:var(--on-primary-container);padding:32px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.cta ol{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.cta li{display:flex;gap:12px;align-items:center}
.cta li b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:500 14px Roboto}
.cta .btn-filled{margin-top:20px}
.page{padding:24px 0 48px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:24px 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.empty{padding:48px 24px;text-align:center;border:1px dashed var(--outline);border-radius:12px;display:grid;gap:12px;justify-items:center}

/* detalhe */
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:start}
.gallery{border-radius:28px;background:var(--sc);aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.gallery .ph{height:84%;width:auto}
.gallery img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.info{display:grid;gap:16px}
.info .tagrow{display:flex;gap:8px;flex-wrap:wrap}
dl.spec{margin:0;display:grid}
dl.spec div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--outline-variant)}
dl.spec dt{color:var(--on-surface-variant)}dl.spec dd{margin:0;text-align:right}
.seller{display:flex;gap:16px;align-items:center;padding:16px;border-radius:12px;background:var(--sc-low);border:1px solid var(--outline-variant)}
.batbig{display:flex;gap:16px;align-items:center;padding:16px;border-radius:12px;background:var(--sc-low)}
.batbig .ring{width:72px;height:72px}
.batbig .ring text{font-size:9px}
.msg{display:grid;gap:12px;padding:16px;border-radius:12px;background:var(--sc-low);border:1px solid var(--outline-variant)}
.msg[hidden]{display:none}

/* formulários */
.auth{max-width:440px;margin:24px auto;background:var(--sc-low);border:1px solid var(--outline-variant);border-radius:28px;padding:24px;display:grid;gap:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--outline-variant)}
.tabs button{height:48px;border:0;background:none;color:var(--on-surface-variant);font:500 14px/20px Roboto;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--primary)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:25%;right:25%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.sell{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:start}
.sell form{display:grid;gap:16px}
.sell aside{position:sticky;top:88px;display:grid;gap:12px}
.drop{display:flex;align-items:center;gap:12px;padding:16px;border:1px dashed var(--outline);border-radius:12px;cursor:pointer;color:var(--on-surface-variant)}
.drop:hover{background:var(--sc-low)}
.note{padding:12px 16px;border-radius:12px;background:var(--secondary-container);color:var(--on-secondary-container)}
.faq{display:grid;gap:8px;max-width:760px}
.faq details{border-radius:12px;background:var(--sc-low);border:1px solid var(--outline-variant);padding:0 16px}
.faq summary{min-height:56px;display:flex;align-items:center;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";margin-left:auto;border:5px solid transparent;border-top-color:var(--on-surface-variant);transition:transform .2s;margin-top:5px}
.faq details[open] summary::after{transform:rotate(180deg);margin-top:-5px}
.faq p{padding-bottom:16px;color:var(--on-surface-variant)}
footer{margin-top:48px;background:var(--sc);padding:32px 0}
footer .wrap{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
footer a{color:var(--on-surface-variant);text-decoration:none}footer a:hover{color:var(--primary)}

/* snackbar */
.snack{position:fixed;left:50%;bottom:24px;transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:50;background:var(--inverse-surface);color:var(--inverse-on-surface);border-radius:4px;padding:14px 16px;min-width:240px;max-width:calc(100% - 32px);box-shadow:var(--shadow3);transition:all .2s}
.snack.on{opacity:1;transform:translate(-50%,0)}

/* navigation bar (compacto) */
.botnav{display:none}
@media (max-width:1000px){
  .hero{grid-template-columns:1fr}
  .hero-art{height:260px}
  .search .row{grid-template-columns:1fr 1fr}
  .search .row .go{grid-column:1/-1}
  .search .adv{grid-template-columns:1fr 1fr}
  .detail,.sell,.cta{grid-template-columns:1fr}
  .sell aside{position:static}
}
@media (max-width:599px){
  .topnav{display:none}
  body{padding-bottom:80px}
  .display{font-size:36px;line-height:44px}
  .search{padding:16px;border-radius:24px}
  .search .row,.search .adv,.form-grid{grid-template-columns:1fr}
  .cta{padding:24px}
  .fab{bottom:96px}
  .snack{bottom:96px}
  .botnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:25;height:80px;background:var(--sc);padding:12px 8px 16px}
  .botnav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--on-surface-variant);font:500 12px/16px Roboto}
  .botnav a .ind{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
  .botnav a[aria-current="page"]{color:var(--on-surface)}
  .botnav a[aria-current="page"] .ind{background:var(--secondary-container);color:var(--on-secondary-container)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

/* hero com banner e cartão de pesquisa flutuante */
.hero{display:block;padding:24px 0 0}
.hero-banner{position:relative;height:300px;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;padding:56px 24px 0;background:#2a2f3a}
.hero-banner>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.hero-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,16,30,.55),rgba(12,16,30,.35) 55%,rgba(12,16,30,.55))}
.hero-banner>*:not(img){position:relative;z-index:1}
.hero-banner h1{max-width:20ch;margin:0 auto;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.hero-banner p.lead{max-width:46ch;color:rgba(255,255,255,.92)}
.hero-pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 4px;border-radius:16px;background:rgba(20,22,28,.85);color:#fff;text-decoration:none}
.hero-pill .bolt{width:24px;height:24px;border-radius:12px;background:#fff;color:#1a1b20;display:grid;place-items:center}
.search.float{position:relative;z-index:2;max-width:980px;margin:-72px auto 0;background:var(--surface);border:0;border-radius:20px;padding:16px;box-shadow:var(--shadow3)}
.search.float .adv{border-top-color:var(--outline-variant)}
@media (max-width:599px){.hero-banner{height:280px;padding-top:40px;border-radius:24px}.search.float{margin-top:-64px;padding:12px;border-radius:16px}}

/* megamenu Explorar */
.mega-wrap{position:static;display:flex;align-items:center;height:64px}
.mega-btn{height:40px;padding:0 12px 0 16px;border-radius:20px;border:0;background:none;display:inline-flex;align-items:center;gap:4px;color:var(--on-surface-variant);cursor:pointer}
.mega{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--outline-variant);box-shadow:var(--shadow1);padding:24px 0 28px}
.mega-wrap.open .mega{display:block}
.mega-btn svg{transition:transform .2s}
.mega-wrap.open .mega-btn svg{transform:rotate(180deg)}
.mega-wrap.open .mega-btn{background:var(--sc-high)}
.topbar .mega .mega-grid{display:grid;grid-template-columns:minmax(280px,1fr) 2fr;gap:48px;height:auto;align-items:start}
.mega h2{margin:0 0 8px 12px;color:var(--on-surface-variant)}
.mega ul{list-style:none;margin:0;padding:0;display:grid}
.mega ul.cols{grid-template-columns:repeat(3,1fr);column-gap:8px}
.mega ul a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px 12px;border-radius:12px;color:var(--on-surface);text-decoration:none}
.mega ul a:hover{background:var(--sc-high)}
.mega .cnt{min-width:24px;text-align:right}
.mega .all{margin:12px 0 0 0}
@media (max-width:1000px){.topbar .mega .mega-grid{grid-template-columns:1fr;gap:16px}.mega ul.cols{grid-template-columns:repeat(2,1fr)}.mega{max-height:calc(100vh - 64px);overflow:auto}}
.mega ul.states{gap:8px}
.mega ul.states a{background:var(--secondary-container);color:var(--on-secondary-container);padding:10px 16px}
.mega ul.states a .muted{color:var(--on-secondary-container);opacity:.8}
.mega ul.states a:hover{background:var(--primary-container);color:var(--on-primary-container)}
/* cor terciária */
.pill.warn{background:var(--error-container);color:var(--on-error-container)}
.pill.tert{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.cta{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.cta li b{background:var(--tertiary);color:var(--on-tertiary)}
.cta .btn-filled{background:var(--tertiary);color:var(--on-tertiary)}
.divider{border:0;border-top:1px solid var(--outline-variant);margin:40px 0 0}

/* mensagens */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none}
.topnav .dot{margin-left:6px}
.botnav .ind{position:relative}
.botnav .dot{position:absolute;top:2px;right:16px}
.msgs{display:grid;grid-template-columns:360px 1fr;height:min(680px,calc(100vh - 200px));min-height:480px;border:1px solid var(--outline-variant);border-radius:16px;overflow:hidden;background:var(--surface)}
.convs{overflow:auto;border-right:1px solid var(--outline-variant);display:flex;flex-direction:column}
.conv{display:flex;gap:12px;padding:12px 16px;text-decoration:none;color:var(--on-surface);border-bottom:1px solid var(--outline-variant)}
.conv:hover{background:var(--sc-high)}
.conv.on{background:var(--secondary-container);color:var(--on-secondary-container)}
.conv .avatar,.thread .avatar{cursor:default;flex:none;display:grid;place-items:center}
.conv .cbody{display:grid;gap:2px;min-width:0;flex:1}
.conv .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.conv .prev{display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.conv.unread .prev{font-weight:500;color:var(--on-surface)}
.one{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.thread>header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--outline-variant)}
.thread .back{display:none}
.bubbles{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:min(78%,520px);padding:8px 12px;border-radius:16px;display:flex;flex-direction:column;gap:2px}
.bub p{margin:0;text-wrap:pretty}
.bub.me{align-self:flex-end;background:var(--primary-container);color:var(--on-primary-container);border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--sc-high);border-bottom-left-radius:4px}
.bub .label-m{opacity:.7;align-self:flex-end}
.composer{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--outline-variant)}
.composer .tf{flex:1}
.composer .send,.composer .send:hover{background:var(--primary);color:var(--on-primary);width:48px;height:48px;flex:none}
.empty-thread{display:grid;place-items:center}
@media (max-width:700px){
  .msgs{grid-template-columns:1fr;height:calc(100vh - 240px)}
  .msgs.has-thread .convs{display:none}
  .msgs:not(.has-thread) .thread{display:none}
  .thread .back{display:grid}
}
</style>
</head>
<body>
<header class="topbar"><div class="wrap" id="top"></div></header>
<main id="main" tabindex="-1"></main>
<footer><div class="wrap">
  <div><div class="title-m">Outra Volta</div><p class="body-m muted" style="max-width:36ch">Anúncios de iPhones em segunda mão, entre pessoas. Projeto de demonstração.</p></div>
  <nav class="body-m"><a href="#resultados">Explorar</a><a href="#vender">Vender</a><a href="#ajuda">Ajuda</a></nav>
</div></footer>
<nav class="botnav" id="botnav" aria-label="Navegação principal"></nav>
<div class="snack" id="snack" role="status" aria-live="polite"></div>

let gid=0;
function phone(color,cams=2){
  const g='g'+(++gid),c=COLORS[color]||'#999';
  const lens=(x,y)=>`<circle cx="${x}" cy="${y}" r="9" fill="#14161a"/><circle cx="${x}" cy="${y}" r="5" fill="#2b313c"/><circle cx="${x-2}" cy="${y-2}" r="1.5" fill="#fff" opacity=".6"/>`;
  let pl='',ls='';
  if(cams===3){pl='<rect x="10" y="10" width="52" height="54" rx="14"/>';ls=lens(26,26)+lens(46,26)+lens(36,48)+'<circle cx="54" cy="46" r="3" fill="#fff" opacity=".7"/>';}
  else if(cams===2){pl='<rect x="10" y="10" width="46" height="46" rx="12"/>';ls=lens(25,25)+lens(41,41)+'<circle cx="45" cy="19" r="3" fill="#fff" opacity=".7"/>';}
  else{pl='<rect x="10" y="10" width="34" height="34" rx="10"/>';ls=lens(27,27);}
  return `<svg class="ph" viewBox="0 0 120 240" role="img" aria-label="iPhone ${esc(color.toLowerCase())}"><defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient></defs><rect x="4" y="2" width="112" height="236" rx="26" fill="${c}"/><rect x="4" y="2" width="112" height="236" rx="26" fill="url(#${g})"/><rect x="4" y="2" width="112" height="236" rx="26" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2"/><g fill="#000" fill-opacity=".16" stroke="#000" stroke-opacity=".12" transform="translate(6 4)">${pl}</g><g transform="translate(6 4)">${ls}</g></svg>`;
}
function ring(p,anim=false){
  const r=14,len=2*Math.PI*r,col=p>=90?'--good':p>=80?'--warn':'--error';
  return `<svg class="ring${anim?' anim':''}" viewBox="0 0 36 36" role="img" aria-label="Saúde da bateria ${p}%"><circle class="t" cx="18" cy="18" r="${r}"/><circle class="v" cx="18" cy="18" r="${r}" style="stroke:var(${col});stroke-dasharray:${len};stroke-dashoffset:${len*(1-p/100)};--len:${len}"/><text x="18" y="21.5">${p}</text></svg>`;
}

/* ---------- filtros ---------- */
function matches(l,f){
  if(f.q){const t=norm([l.title,l.model,l.color,l.desc,l.storage].join(' '));if(!norm(f.q).split(/\s+/).every(w=>t.includes(w)))return false}
  if(f.cond&&l.cond!==f.cond)return false;
  if(f.min!==''&&l.price<+f.min)return false;
  if(f.max!==''&&l.price>+f.max)return false;
  if(f.loc&&l.loc!==f.loc)return false;
  if(f.model&&l.model!==f.model)return false;
  if(f.storage&&l.storage!==f.storage)return false;
  if(f.bat&&l.bat<+f.bat)return false;
  if(f.unlocked&&!l.unlocked)return false;
  if(f.warranty&&!l.warranty)return false;
  return true;
}
const SORTS={recent:(a,b)=>a.days-b.days||b.id-a.id,'price-asc':(a,b)=>a.price-b.price,'price-desc':(a,b)=>b.price-a.price,bat:(a,b)=>b.bat-a.bat};

 ['Como sei a saúde da bateria do meu iPhone?','Abra Definições, Bateria, Saúde da bateria. O valor aparece como capacidade máxima, em percentagem.'],
 ['Que estados posso escolher?','Como novo, Muito bom, Bom, Com marcas e Para peças. Escolha o que descreve melhor o telemóvel e mencione marcas ou avarias na descrição.'],
 ['Como combino a entrega e o pagamento?','Fale com o comprador por mensagem e combine uma entrega em mão num local público. Verifique o telemóvel antes de pagar.'],
 ['O que devo fazer antes de entregar o telemóvel?','Faça uma cópia de segurança, termine a sessão no iCloud, desative Encontrar o meu iPhone e apague todo o conteúdo e definições.'],
 ['Como guardo anúncios para ver mais tarde?','Toque no coração de um anúncio. Os anúncios guardados ficam em Guardados, disponível quando tem sessão iniciada.']
];
function pageHelp(){
  return `<div class="wrap page"><div class="page-head"><h1 class="headline-l">Ajuda</h1></div><div class="faq">${FAQ.map(([q,a])=>`<details><summary class="title-m">${q}</summary><p>${a}</p></details>`).join('')}</div></div>`;
}

/* ---------- cabeçalho e navegação ---------- */
function renderChrome(r){
  const cur=n=>r===n?' aria-current="page"':'';
  const savedN=S.saved.size;
  const nav=[['resultados','Explorar'],['vender','Vender'],['ajuda','Ajuda']];
  const isEx=r==='resultados'||r.startsWith('anuncio');
  const CD={'Como novo':'Sem marcas de uso visíveis','Muito bom':'Marcas mínimas, só vistas de perto','Bom':'Alguns riscos finos','Com marcas':'Marcas visíveis, funciona bem','Para peças':'Avariado ou com ecrã partido'};
  const cnt=(k,v)=>LISTINGS.filter(l=>l[k]===v).length;
  const mi=(k,v,main,sub)=>`<li><a href="#resultados" data-action="mega" data-kind="${k}" data-v="${esc(v)}"><span><span class="title-m">${esc(main)}</span>${sub?`<span class="body-m muted" style="display:block">${sub}</span>`:''}</span></a></li>`;
  const megaHtml=`<div class="mega-wrap"><button class="mega-btn label-l" type="button" data-action="mega-btn" aria-haspopup="true" aria-expanded="false"${isEx?' aria-current="page"':''}>Explorar${ic('more','s')}</button>
   <div class="mega"><div class="wrap mega-grid">
    <section aria-label="Por estado"><h2 class="title-m">Por estado</h2><ul class="states">${CONDS.map(c=>mi('cond',c,c,CD[c])).join('')}</ul></section>
    <section aria-label="Por modelo"><h2 class="title-m">Por modelo</h2><ul class="cols">${MODELS.map(m=>mi('model',m,m,'')).join('')}</ul>
     <a class="btn btn-text all" href="#resultados" data-action="mega" data-kind="all">Ver todos os anúncios</a></section>
   </div></div></div>`;
  $('#top').innerHTML=`<a class="logo" href="#inicio" aria-label="Outra Volta, página inicial">${ic('loop')}Outra Volta</a>
   <nav class="topnav" aria-label="Principal">
    ${megaHtml}<a href="#vender"${r==='vender'?' aria-current="page"':''}>Vender</a><a href="#ajuda"${r==='ajuda'?' aria-current="page"':''}>Ajuda</a>
    ${S.user?`<a href="#guardados"${cur('guardados')}>Guardados</a><a href="#mensagens"${cur('mensagens')}>Mensagens${hasUnread()?'<span class="dot" role="img" aria-label="Mensagens por ler"></span>':''}</a>`:''}
   </nav><div class="spacer"></div>${themeBtn()}
   ${S.user?`<div class="menu-wrap"><button class="avatar" data-action="menu" aria-haspopup="true" aria-expanded="${S.menu}" aria-label="Conta de ${esc(S.user.name)}">${esc(S.user.name[0].toUpperCase())}</button>
     <div class="menu" ${S.menu?'':'hidden'}><div class="who"><div class="title-m">${esc(S.user.name)}</div><div class="body-m muted">${esc(S.user.email)}</div></div>
      <a href="#meus-anuncios">${ic('list')}Os meus anúncios</a><a href="#guardados">${ic('fav')}Guardados</a><a href="#mensagens">${ic('chat')}Mensagens</a><button data-action="logout">${ic('out')}Sair</button></div></div>`
   :`<a class="btn btn-filled" href="#entrar">Entrar</a>`}`;
  const bn=[['resultados','search','Explorar',isEx],['vender','add','Vender',r==='vender'],['ajuda','help','Ajuda',r==='ajuda']];
  if(S.user){bn.push(['guardados','fav','Guardados',r==='guardados']);bn.push(['mensagens','chat','Mensagens',r==='mensagens'])}else bn.push(['entrar','list','Entrar',r==='entrar']);
  $('#botnav').innerHTML=bn.map(([h,i,t,a])=>`<a href="#${h}"${a?' aria-current="page"':''}><span class="ind">${ic(i)}${t==='Mensagens'&&hasUnread()?'<span class="dot"></span>':''}</span>${t}</a>`).join('');
}

/* ---------- router ---------- */
function parse(){
  const h=(location.hash||'#inicio').slice(1);
  const m=h.match(/^anuncio-(\d+)$/);
  if(m)return {r:'anuncio-'+m[1],id:+m[1]};
  const mm=h.match(/^mensagens(?:-(\d+))?$/);if(mm)return {r:'mensagens',id:mm[1]?+mm[1]:null};
  return {r:['inicio','resultados','vender','ajuda','entrar','guardados','meus-anuncios'].includes(h)?h:'inicio'};
}
function render(scroll){
  let {r,id}=parse();
  if((r==='guardados'||r==='meus-anuncios'||r==='mensagens')&&!S.user){S.after='#'+r;r='entrar';history.replaceState(null,'','#entrar')}
  if(r==='entrar'&&S.user){r='inicio'}
  const pages={inicio:pageHome,resultados:pageResults,vender:pageSell,ajuda:pageHelp,entrar:pageLogin,guardados:pageSaved,'meus-anuncios':pageMine,mensagens:()=>pageMessages(id)};
  $('#main').innerHTML=r.startsWith('anuncio-')?pageDetail(id):pages[r]();
  renderChrome(r);
  const bb=$('#bubbles');if(bb)bb.scrollTop=bb.scrollHeight;
  if(scroll)window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',()=>{S.menu=false;render(true)});
function go(h){if(location.hash===h)render(true);else location.hash=h}
function toast(t){const s=$('#snack');s.textContent=t;s.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>s.classList.remove('on'),3200)}
function persist(){store.set('ov-user',S.user);store.set('ov-saved',[...S.saved])}
function toggleSave(id){
  if(!S.user){S.pendingSave=id;S.after=location.hash||'#inicio';toast('Entre para guardar anúncios');go('#entrar');return}
  S.saved.has(id)?S.saved.delete(id):S.saved.add(id);persist();
  toast(S.saved.has(id)?'Anúncio guardado':'Anúncio removido dos guardados');
  const y=scrollY;render();scrollTo(0,y);
}
function readSearch(form){
  const d=new FormData(form),f={...DEF};
  for(const k of ['q','cond','min','max','loc','model','storage','bat'])if(d.has(k))f[k]=String(d.get(k)).trim();
  f.unlocked=!!form.elements.unlocked&&form.elements.unlocked.checked;f.warranty=!!form.elements.warranty&&form.elements.warranty.checked;
  S.f=f;
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!e.target.closest('.mega-wrap')){const mw=$('.mega-wrap.open');if(mw){mw.classList.remove('open');mw.querySelector('.mega-btn').setAttribute('aria-expanded','false')}}
  if(S.menu&&!e.target.closest('.menu-wrap')){S.menu=false;const m=$('.menu');if(m)m.hidden=true}
  if(!t)return;
  const a=t.dataset.action;
  if(a==='save'){e.preventDefault();toggleSave(+t.dataset.id)}
  else if(a==='adv'){const p=t.closest('form').querySelector('.adv');p.hidden=!p.hidden;t.setAttribute('aria-expanded',!p.hidden)}
  else if(a==='clear'){S.f={...DEF};render()}
  else if(a==='all'){S.f={...DEF};S.sort='recent'}
  else if(a==='chip'){const k=t.dataset.key;if(k==='price'){S.f.min='';S.f.max=''}else S.f[k]=DEF[k];render()}
  else if(a==='theme'){const n=effTheme()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('ov-theme',n)}catch(err){}renderChrome(parse().r)}
  else if(a==='mega'){const k=t.dataset.kind;S.f={...DEF};if(k!=='all')S.f[k]=t.dataset.v;S.sort='recent';if(document.activeElement)document.activeElement.blur();if(location.hash==='#resultados'){e.preventDefault();render(true)}}
  else if(a==='mega-btn'){const w=t.closest('.mega-wrap'),o=!w.classList.contains('open');w.classList.toggle('open',o);t.setAttribute('aria-expanded',o)}
  else if(a==='menu'){S.menu=!S.menu;$('.menu').hidden=!S.menu;t.setAttribute('aria-expanded',S.menu)}
  else if(a==='logout'){S.user=null;S.menu=false;persist();toast('Sessão terminada');go('#inicio')}
  else if(a==='tab'){S.loginTab=t.dataset.tab;render()}
  else if(a==='gologin'){S.after=t.dataset.after;go('#entrar')}
  else if(a==='contact'){if(!S.user){S.after=location.hash;toast('Entre para enviar mensagens');go('#entrar');return}const f=$('#f-msg');f.hidden=!f.hidden;if(!f.hidden)f.querySelector('input').focus()}
  else if(a==='remove'){const id=+t.dataset.id;LISTINGS=LISTINGS.filter(l=>l.id!==id);toast('Anúncio removido');render()}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form;
  if(k==='search'){readSearch(f);S.sort=S.sort;go('#resultados')}
  else if(k==='login'){
    const d=new FormData(f),email=String(d.get('email')).trim();
    const name=(d.get('name')||email.split('@')[0]).toString().replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    S.user={name,email};
    if(S.pendingSave){S.saved.add(S.pendingSave);S.pendingSave=null}
    persist();toast(S.loginTab==='up'?'Conta criada':'Sessão iniciada');
    const to=S.after||'#inicio';S.after=null;go(to);
  }
  else if(k==='msg'){const text=f.elements.msg.value.trim(),lid=+f.dataset.lid;if(!text)return;sendMsg(lid,text);toast('Mensagem enviada');go('#mensagens-'+lid)}
  else if(k==='reply'){const text=f.elements.text.value.trim(),lid=+f.dataset.lid;if(!text)return;sendMsg(lid,text);render();const i=$('#r-t');if(i)i.focus()}
  else if(k==='sell'){
    const d=sellDraft(f);
    const l={...d,id:nextId++,seller:S.user.name,unlocked:f.elements.unlocked.checked,warranty:'',desc:f.elements.desc.value||'Sem descrição.',mine:true};
    LISTINGS.unshift(l);S.photos=[];toast('Anúncio publicado');go('#meus-anuncios');
  }
});
document.addEventListener('input',e=>{
  const f=e.target.closest('#f-sell');if(f)$('#sell-preview').innerHTML=card(sellDraft(f),{preview:true});
});
document.addEventListener('change',e=>{
  if(e.target.id==='sort'){S.sort=e.target.value;render()}
  else if(e.target.id==='s-photos'){S.photos=[...e.target.files].map(f=>URL.createObjectURL(f));$('#sell-preview').innerHTML=card(sellDraft($('#f-sell')),{preview:true});toast(`${S.photos.length} ${S.photos.length===1?'fotografia adicionada':'fotografias adicionadas'}`)}
  else if(e.target.closest('#f-sell'))$('#sell-preview').innerHTML=card(sellDraft($('#f-sell')),{preview:true});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const mw=$('.mega-wrap.open');if(mw){mw.classList.remove('open');const b=mw.querySelector('.mega-btn');b.setAttribute('aria-expanded','false');b.focus()}}if(e.key==='Escape'&&S.menu){S.menu=false;const m=$('.menu');if(m)m.hidden=true}});
render(false);
</script>
</body>
</html>
